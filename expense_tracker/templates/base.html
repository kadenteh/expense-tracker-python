<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{{ url_for('dashboard.index') }}">
        <span class="brand__mark" aria-hidden="true">$</span>
        <span>Expense Tracker</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('dashboard.index') }}" class="{{ 'active' if request.endpoint == 'dashboard.index' else '' }}">Dashboard</a>
        <a href="{{ url_for('expenses.list_view') }}" class="{{ 'active' if request.blueprint == 'expenses' else '' }}">Expenses</a>
        <a href="{{ url_for('exports.center') }}" class="{{ 'active' if request.blueprint == 'exports' else '' }}">
          Exports{% if active_export_count %}<span class="nav-activity" title="{{ active_export_count }} export(s) running"><span class="visually-hidden">, {{ active_export_count }} running</span></span>{% endif %}
        </a>
      </nav>
    </div>
  </header>

  <main>
    {% include "partials/flashes.html" %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
