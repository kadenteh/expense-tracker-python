<div class="row-actions-wrap" data-expense-id="{{ e.id }}">
  <span class="row-actions row-actions-default">
    <a class="icon-btn edit" href="{{ url_for('expenses.edit', expense_id=e.id) }}" aria-label="Edit {{ e.description }}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M11.3 2.3a1 1 0 0 1 1.4 0l1 1a1 1 0 0 1 0 1.4l-7 7-3 .7.7-3 7-7Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path>
      </svg>
    </a>
    <button type="button" class="icon-btn danger" data-action="confirm-delete" aria-label="Delete {{ e.description }}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 4.5h10M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M4.5 4.5l.6 8a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </span>

  <span class="confirm-row" data-role="confirm">
    <span class="confirm-label">Delete?</span>
    <form method="post" action="{{ url_for('expenses.delete', expense_id=e.id) }}" style="display:inline;">
      <button type="submit" class="btn btn-danger" style="padding:0.25rem 0.5rem;font-size:0.75rem;">Confirm</button>
    </form>
    <button type="button" class="btn btn-secondary" data-action="cancel-delete" style="padding:0.25rem 0.5rem;font-size:0.75rem;">Cancel</button>
  </span>
</div>
